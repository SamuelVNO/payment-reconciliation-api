server {
    listen 80;
    root /usr/share/nginx/html;

    # Mesma origem para o navegador: /api vai para o Spring Boot, sem CORS
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # O RequestIdFilter da API aceita este id e ele aparece em todos os logs da requisição
        proxy_set_header X-Request-Id $request_id;
        client_max_body_size 5m;
    }

    # Arquivos com hash no nome nunca mudam: cache de 1 ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota do React cai no index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
