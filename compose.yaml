services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reconciliation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
