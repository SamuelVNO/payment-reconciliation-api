spring.application.name=payment-reconciliation-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reconciliation}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true
# Mensagens do Bean Validation seguem o Locale: sem fixar, saem em português numa máquina
# e em inglês no container. A API responde sempre em inglês.
spring.web.locale=en
spring.web.locale-resolver=fixed
server.error.include-stacktrace=never

# UUID gerado pela app permite batch de INSERT (IDENTITY obrigaria um round-trip por linha)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.scheduling.enabled=${SCHEDULING_ENABLED:true}
app.payout-inbox.directory=${PAYOUT_INBOX_DIR:./payout-inbox}
app.payout-inbox.cron=${PAYOUT_INBOX_CRON:0 */5 * * * *}

app.reconciliation.cron=${RECONCILIATION_CRON:0 0 3 * * *}
app.reconciliation.batch-size=500
app.reconciliation.settlement-days=2
app.reconciliation.fee-tolerance=0.00

# Sem default de propósito: em produção a app não sobe sem JWT_SECRET (fail fast).
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=payment-reconciliation-api
app.security.jwt.ttl=PT1H
# Admin inicial criado no boot se ADMIN_EMAIL e ADMIN_PASSWORD estiverem definidos
app.security.admin.email=${ADMIN_EMAIL:}
app.security.admin.password=${ADMIN_PASSWORD:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# acks=all + idempotence: o broker só confirma quando todas as réplicas gravaram, sem duplicar em retry
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.consumer.group-id=reconciliation-notifications
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.topics.discrepancies=reconciliation.discrepancy-detected
app.outbox.poll-interval=PT2S
app.outbox.batch-size=100

# Kafka imprime toda a configuração do client em INFO: ruído puro
logging.level.org.apache.kafka=WARN

# Actuator: liveness/readiness para o orquestrador, métricas para o Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# Readiness inclui o banco: sem Postgres a instância sai do balanceador, mas não é reiniciada (liveness)
management.endpoint.health.group.readiness.include=readinessState,db
management.info.java.enabled=true
management.metrics.tags.application=${spring.application.name}

# requestId do MDC em toda linha de log (no formato JSON ele vira um campo próprio)
logging.pattern.correlation=[%X{requestId:-}] 

springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
